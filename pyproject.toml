[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mvbench"
version = "0.1.0"
description = "Cross-view state consistency metrics for robot video generation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
